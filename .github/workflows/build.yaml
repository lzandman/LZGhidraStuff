# Builds, lints and tests both extensions against the Ghidra release zips below.
# Runs when started by hand (Actions tab, or `gh workflow run build.yaml`) and when release.yaml
# calls it. The matrix is the one list of Ghidra versions: release.yaml packages whatever
# extension zips this workflow uploads.
name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (Ghidra ${{ matrix.ghidra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghidra: ["12.2"]
    steps:
      - uses: actions/checkout@v7

      # Release number in the extensions' descriptions (see build.gradle): the tag, else
      # dev-<commit>, the same name release.yaml gives the zips.
      - name: Set release number
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "ORG_GRADLE_PROJECT_lzRelease=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "ORG_GRADLE_PROJECT_lzRelease=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Download Ghidra ${{ matrix.ghidra }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ghidra-zip"
          gh release download "Ghidra_${{ matrix.ghidra }}_build" \
            --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' \
            --dir "$RUNNER_TEMP/ghidra-zip"
          unzip -q "$RUNNER_TEMP/ghidra-zip"/*.zip -d "$RUNNER_TEMP/ghidra"
          install_dir=$(ls -d "$RUNNER_TEMP"/ghidra/ghidra_*)
          echo "GHIDRA_INSTALL_DIR=$install_dir" >> "$GITHUB_ENV"
          java_min=$(sed -n 's/^application.java.min=//p' "$install_dir/Ghidra/application.properties")
          echo "JAVA_MIN=$java_min" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MIN }}

      # Stay on setup-gradle v5; do not upgrade to v6 or later. Decided by the maintainer, 2026-10-18.
      # v6 moved the Gradle User Home caching into gradle-actions-caching, a closed-source component
      # under Gradle's Terms of Use, which upgrading accepts. It is on by default (6.1.0 added an
      # open-source opt-in, cache-provider: basic). Those terms can change at any time, private
      # repositories get it only as a "Free Preview", and Gradle may collect cache metadata. v5 is
      # MIT-licensed and runs on Node 24; the cache saves little here (plugin and tool downloads).
      # When v5 must be replaced, ask the maintainer first; the candidate is v6 with
      # cache-provider: basic. https://blog.gradle.org/github-actions-for-gradle-v6 and
      # https://blog.gradle.org/choice-clarity-future-caching-gradle-actions
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.1"

      # Full version: ruff-action has no major tag (v4) since v4.0.0. Dependabot updates it.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "--version"

      - name: Install shellcheck
        run: command -v shellcheck || sudo apt-get install -y shellcheck

      - name: Run check.sh
        run: ./check.sh

      - uses: actions/upload-artifact@v7
        with:
          name: extensions-ghidra-${{ matrix.ghidra }}
          path: "*/dist/*.zip"
